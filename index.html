<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <title>Project Kingdom — RZ Survival</title>

    <!-- SEO dasar -->
    <meta
      name="description"
      content="Project Kingdom (RZ Survival) — server Minecraft SMP kerajaan dengan sistem ekonomi, klan, dungeon, dan boss raid. Pilih arketipe-mu: Penakluk, Pedagang, Pengrajin, atau Penjelajah, lalu mulai petualanganmu."
    />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Open Graph (preview pas link di-share ke WhatsApp/Discord/dll) -->
    <!-- CATATAN: karena web ini SPA (semua halaman di-render lewat JavaScript
         di 1 file HTML yang sama), tag di bawah ini SATU-SATUNYA yang kebaca
         aplikasi chat kayak WhatsApp/Discord — mereka nggak jalanin JS kita,
         jadi preview-nya bakal SAMA untuk semua halaman/URL hash manapun yang
         di-share, nggak bisa beda-beda per section. Ini batasan wajar buat
         SPA client-side kayak gini, bukan bug. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Project Kingdom" />
    <meta property="og:title" content="Project Kingdom — RZ Survival" />
    <meta
      property="og:description"
      content="Server Minecraft SMP kerajaan dengan sistem ekonomi, klan, dungeon, dan boss raid. Pilih arketipe-mu dan mulai petualanganmu."
    />
    <meta property="og:image" content="https://webs.rzs.my.id/assets/images/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://webs.rzs.my.id/" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter/X Card (format preview beda dari Open Graph, sebagian besar platform lain ikut baca og: di atas juga) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Project Kingdom — RZ Survival" />
    <meta
      name="twitter:description"
      content="Server Minecraft SMP kerajaan dengan sistem ekonomi, klan, dungeon, dan boss raid."
    />
    <meta name="twitter:image" content="https://webs.rzs.my.id/assets/images/og-preview.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
